version: '3.8'

services:
  # 1. MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: nexacart-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nexacart_db
      MYSQL_USER: nexauser
      MYSQL_PASSWORD: nexapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-run schema and seed on initial container creation
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexacart-network

  # 2. Node.js + Express Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexacart-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: nexacart_db
      JWT_SECRET: nexacart-super-secret-jwt-key-2026
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nexacart-network

  # 3. React + Vite + Nginx Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexacart-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nexacart-network

volumes:
  mysql_data:

networks:
  nexacart-network:
    driver: bridge

