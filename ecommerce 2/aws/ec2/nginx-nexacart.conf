# =======================================================
# NexaCart AI - Production Nginx Configuration
# Path: /etc/nginx/sites-available/nexacart
# =======================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your custom domain or EC2 Public IP

    # Redirect all HTTP requests to HTTPS (Uncomment after SSL is configured)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Backend Express API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React SPA Static Build
    location / {
        root /var/www/nexacart/client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache control
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        root /var/www/nexacart/client/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

